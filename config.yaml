# PULSE-360 configuration
# The brand you track, plus the competitors it is benchmarked against.
# Entity order matters: chart colors are assigned in this fixed order.
#
# Default setup: Airtel — the market I managed from the inside — benchmarked
# against the world's telecom giants for global share-of-voice context.
#
# news_query: the phrase searched in world news (GDELT). Use a distinctive
# phrase for short/ambiguous brand names.

brand:
  name: Airtel
  wikipedia_article: Bharti_Airtel
  news_query: Airtel

competitors:
  - name: Verizon
    wikipedia_article: Verizon
    news_query: Verizon
  - name: AT&T
    wikipedia_article: AT&T
    news_query: AT&T
  - name: T-Mobile
    wikipedia_article: T-Mobile_US
    news_query: T-Mobile
  - name: Vodafone
    wikipedia_article: Vodafone
    news_query: Vodafone
  - name: Deutsche Telekom
    wikipedia_article: Deutsche_Telekom
    news_query: Deutsche Telekom
  - name: China Mobile
    wikipedia_article: China_Mobile
    news_query: China Mobile

# How far back to fetch/keep daily series.
lookback_days: 90

# Reddit public search (optional — Reddit now blocks most keyless scripted
# access with 403; the fetcher degrades gracefully if blocked).
reddit:
  results_per_brand: 100
  time_window: month   # hour | day | week | month | year

# Channel Health Score weights — the same weighted-signal approach I used
# for enterprise account health scoring, applied to marketing channels.
# Must sum to 1.0.
health_weights:
  momentum: 0.35        # week-over-week trajectory
  stability: 0.20       # volatility of the daily series (lower churn of attention)
  sentiment: 0.25       # tone of news/community mentions
  share_of_voice: 0.20  # brand share vs competitors

# ---------------------------------------------------------------------------
# PULSE-MMM — Meridian-style Bayesian marketing mix model (python run_mmm.py)
# Input: one row per (geo, week). The default file is synthetic, with a known
# ground truth (data/mmm_truth.json); swap in your own CSV with the same columns.
mmm:
  data: data/mmm_input.csv
  truth: data/mmm_truth.json        # only exists for the synthetic demo
  currency: "₹ lakh"
  channels:
    # roi_prior = what you believe before seeing this data (mean, sd of ROI).
    # Default is deliberately wide; an experiment gets a tight prior.
    - name: TV
      column: spend_tv
      roi_prior: {mean: 1.5, sd: 1.5, source: "default (no experiment)"}
    - name: YouTube
      column: spend_youtube
      roi_prior: {mean: 2.0, sd: 0.4, source: "geo-lift experiment"}
    - name: Meta
      column: spend_meta
      roi_prior: {mean: 1.5, sd: 1.5, source: "default (no experiment)"}
    - name: Paid Search
      column: spend_search
      roi_prior: {mean: 1.5, sd: 1.5, source: "default (no experiment)"}
  # Confounders only — things that drive BOTH spend and sales. Mediators
  # (e.g. brand-search volume that TV itself creates) are left out on purpose.
  controls: [festive, gqv, price_index, promo, competitor_promo]
  # Re-fit without these controls to show what a naive model would claim.
  compare_without: [gqv]
  sampler: {chains: 4, warmup: 800, draws: 800, seed: 7}
  optimizer_bounds: 0.3             # each channel may move ±30%; total fixed
